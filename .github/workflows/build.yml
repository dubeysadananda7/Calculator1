name: Build LumiVault APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: _src/LumiVault

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p _src
          unzip -q LumiVault-GitHub-ready.zip -d _src
          ls -la ${{ env.APP_DIR }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: ${{ env.APP_DIR }}

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiVault-debug-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.APP_DIR }}/app/build/reports/
