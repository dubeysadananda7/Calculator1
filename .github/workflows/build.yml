name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Gradle project (folder or any zip)
        shell: bash
        run: |
          set -e

          find_settings() {
            find . \( -path ./.git -o -path ./node_modules \) -prune -o \
              -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print \
              | awk '{ print length($0) " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-
          }

          SETTINGS="$(find_settings)"

          if [ -z "$SETTINGS" ]; then
            echo "No Gradle project in repo files. Looking inside zip files..."
            mkdir -p _src
            while IFS= read -r -d '' z; do
              if unzip -l "$z" | grep -Eq 'settings\.gradle(\.kts)?$'; then
                echo "Using zip: $z"
                unzip -q -o "$z" -d _src
                break
              fi
            done < <(find . -path ./.git -prune -o -path ./_src -prune -o -type f -iname '*.zip' -print0)
            SETTINGS="$(find_settings)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found in repo or in any zip file."
            echo "Files in repo:"
            ls -la
            exit 1
          fi

          APP_DIR="$(dirname "$SETTINGS")"
          echo "Project folder: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          ls -la "$APP_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: ${{ env.APP_DIR }}

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ env.APP_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.APP_DIR }}/**/build/reports/
          if-no-files-found: ignore
